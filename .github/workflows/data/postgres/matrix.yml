3_2_x: &3_2_x
  # Min supported version by JDBC driver is 8.2, but it is too ancient to be used by anyone in real life
  postgres-version: 9.4.26-alpine
  etl-entities-version: 2
  spark-version: '3.2'
  python-version: '3.10'
  java-version: 8
  os: ubuntu-latest

3_5_x: &3_5_x
  postgres-version: 18.3-alpine
  etl-entities-version: 3
  spark-version: '3.5'
  python-version: '3.13'
  java-version: 20
  os: ubuntu-latest

4_0_x: &4_0_x
  postgres-version: 18.3-alpine
  etl-entities-version: 3
  spark-version: '4.0'
  python-version: '3.15'
  # https://issues.apache.org/jira/browse/SPARK-54276
  java-version: 22
  os: ubuntu-latest

4_3_x: &4_3_x
  postgres-version: 18.3-alpine
  etl-entities-version: 3
  spark-version: '4.3'
  python-version: '3.15'
  java-version: 27
  os: ubuntu-latest

matrix:
  small: [*3_5_x]
  full: [*3_2_x, *3_5_x, *4_0_x, *4_3_x]
